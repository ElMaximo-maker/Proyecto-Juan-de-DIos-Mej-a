<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../../css/login.css">
</head>
<body>
   
    <main>

        <div class="container" id="container">

            <div class="container-form">
                <form action="" class="login">
                    <h2>Iniciar de sesión</h2>

                    <div class="social-networks">
                        <span>ed</span>
                        <span>ed</span>
                        <span>ed</span>
                        <span>ed</span>
                    </div>

                    <span>Use su correo y contraseña</span>

                    <div class="container-input">
                        <i>A</i>
                        <input id="email-login" type="text" placeholder="Email">
                    </div>

                     <div class="container-input">
                        <i>A</i>
                        <input id="password-login" type="password" placeholder="Password">
                    </div>

                    <a href="">¿Olvidaste tu contraseña?</a>

                    <button class="button" id="btn-login">Iniciar sesión</button>
                </form>
            </div>

            <div class="container-form">
                <form action="" class="register">
                    <h2>Registrarse</h2>
                    <div class="social-networks">
                        <span>ed</span>
                        <span>ed</span>
                        <span>ed</span>
                        <span>ed</span>
                    </div>
                    
                    <div class="container-input">
                        <select id="user-type" class="select-usuario">
                            <option value="">-- Selecciona una opción --</option>
                            <option>Freelancer / Emprendedor</option>
                            <option>Joven en búsqueda de empleo</option>
                            <option>Empresa / Empleador</option>
                            <option value="1">Otros</option>
                        </select>   
                    </div>

                    <div class="container-input">
                        <i>A</i>
                        <input id="user-name" type="text" placeholder="Nombre de Usuario">
                    </div>
                    <div class="container-input">
                        <i>A</i>
                        <input id="age" type="number" placeholder="Edad">
                    </div>
                    <div class="container-input">
                        <i>A</i>
                        <input id="email-register" type="text" placeholder="Email">
                    </div>
                      <div class="container-input">
                        <i>A</i>
                        <input id="password-register" type="password" placeholder="Contraseña">
                    </div>
                     <div class="container-input">
                        <i>A</i>
                        <input id="tel" type="tel" placeholder="Telefono">
                    </div>
                    
                    <button class="button" id="btn-register">Registrarse</button>
                </form>
            </div>

            <div class="container-welcome">
                <div class="welcome-register welcome">
                    <h3>¡Bienvenido!</h3>
                    <p>Ingrese sus datos personales para acceder a las funciones de ImpulsaGE</p>
                    <button class="button" id="btn-w-register">Registrarse</button>
                </div>
                <div class="welcome-login welcome">
                    <h3>¡Hola!</h3>
                    <p>Registrate sus datos personales para acceder a las funciones de ImpulsaGE</p>
                    <button class="button" id="btn-w-login">Iniciar sesión</button>
                </div>
            </div>

        </div>
    </main>
    
</body>
<script src="../../js/login.js"></script>

</html>
